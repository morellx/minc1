<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay Contador de Muertes (OBS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="style.css?v=7.0">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    html, body { background: transparent !important; width: 100%; height: 100%; overflow: hidden; }
    body { display: block; min-height: 0; }
    #root { width: 100%; height: 100%; }
    #debug {
      position: fixed; left: 8px; bottom: 8px; z-index: 99;
      font: 14px/1.4 Consolas, monospace; color: #7CFC00;
      background: rgba(0, 0, 0, 0.8); padding: 6px 10px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="debug" hidden></div>

  <script src="render.js?v=7.0"></script>
  <script>
    /*
      Una sola Fuente de navegador en OBS (1920x1080, fondo transparente).
      Añade ?debug a la URL para ver el estado de la conexión en pantalla.
    */
    const debugEl = document.getElementById('debug');
    const debug = new URLSearchParams(location.search).has('debug');
    let messages = 0, lastMsgAt = 0, lastError = '', lastRev = 0;
    let timer = { running: false, elapsed: 0, t0: performance.now() };

    const counter = DeathCounter.createCounter(document.getElementById('root'));

    if (typeof io === 'undefined') {
      lastError = 'No se pudo cargar socket.io (¿sin internet?)';
      if (debug) { debugEl.hidden = false; debugEl.textContent = `error: ${lastError}`; }
    } else {
      const socket = io();

      socket.on('updateDeathState', (d) => {
        if (!d || d.request || !d.players) return; // ignora mensajes de "pedir estado"
        // Si hay otro panel abierto con datos viejos, su estado se ignora
        if ((d.rev || 0) < lastRev) return;
        lastRev = d.rev || 0;
        messages++;
        lastMsgAt = Date.now();
        timer = { running: d.timer.running, elapsed: d.timer.elapsed, t0: performance.now() };
        try {
          counter.render(d);
          if (d.trigger >= 0) counter.playAnim(d.trigger, d.animation);
          lastError = '';
        } catch (err) {
          lastError = err.message;
          console.error(err);
        }
      });

      // Al conectar pide el estado actual; además el panel lo reenvía cada 2 s.
      socket.on('connect', () => socket.emit('updateDeathState', { request: true }));
      socket.on('connect_error', (e) => { lastError = `connect_error: ${e.message}`; });

      if (debug) {
        debugEl.hidden = false;
        setInterval(() => {
          const ago = lastMsgAt ? `${Math.round((Date.now() - lastMsgAt) / 1000)} s` : 'nunca';
          debugEl.textContent =
            `socket: ${socket.connected ? 'conectado' : 'SIN CONEXIÓN'} | mensajes: ${messages} | último: ${ago} | timer: ${timer.running ? 'en marcha' : 'pausado'}` +
            (lastError ? ` | error: ${lastError}` : '');
        }, 500);
      }
    }

    (function tick() {
      const ms = timer.elapsed + (timer.running ? performance.now() - timer.t0 : 0);
      counter.setTimer(ms, timer.running);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
